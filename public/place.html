<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>장소 정하기</title>
  <link rel="stylesheet" href="./css/place.css">
  <script src="./js/common.js"></script>
  <script type="module" src="./js/place.js"></script>
</head>
<body>
  <header>
    <a id="back-to-room" hidden>← 방으로 돌아가기</a>
    <h1>장소 정하기</h1>
  </header>

  <main>
    <p id="place-status" role="status"></p>
    <!-- 1단계: 출발지 입력 -->
    <section id="origin-section">
        <h2>출발지를 검색해주세요</h2>
        <p>등록된 장소 목록에서 검색할 수 있습니다. 전원이 저장하면 추천이 시작됩니다.</p>
        
        <form id="origin-search-form">
             <label for="origin-query">장소 이름</label>

            <input
            type="search"
            id="origin-query"
            placeholder="예: 광운대학교, 강남역"
            required
            >
            
            <button type="submit">검색</button>
        </form>
        
        <p id="search-status" role="status"></p>
        
        <form id="origin-form">
            <div id="origin-results"></div>
            <button id="origin-save" type="submit" disabled>
            출발지 저장
            </button>
        </form>

        <p id="origin-status" role="status"></p>
    </section>

    <!-- 2단계: 후보 투표 -->
    <section id="vote-section" hidden>
      <h2>만나고 싶은 장소에 투표해주세요</h2>
      <p>모든 참여자의 출발지를 기준으로 가까운 후보를 추천했습니다.</p>
      <p>추천 이후에는 출발지를 변경할 수 없습니다.</p>
      <p>전원이 투표하면 자동 마감됩니다. 마감 전까지 투표를 변경할 수 있습니다.</p>
      <p>투표한 사람의 이름은 공개되지 않습니다.</p>

      <form id="vote-form">
        <div id="candidate-list"></div>
        <button type="submit">투표하기</button>
      </form>

      <p id="vote-status" role="status"></p>
      <h3>현재 투표 현황</h3>
      <button id="refresh-votes" type="button">
            투표 현황 새로고침
        </button>
        <p id="vote-summary" role="status">
        투표 현황은 4초마다 자동 갱신됩니다.
        </p>
        <ul id="vote-counts"></ul>
    </section>

    <!-- 3단계: 최종 결과 -->
    <section id="result-section" hidden>
      <h2>최종 장소</h2>
      <p id="final-place"></p>
      <p id="final-votes"></p>
    </section>
  </main>
</body>
</html>
