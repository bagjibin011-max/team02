<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>약속 조율</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/room.css">
</head>
<body>
    <header class="site-header">
    <div class="header-inner">
      <span class="logo">우리 언제 만나?</span>
    </div>
  </header>

  <main class="home">
    <section class="home-hero">
      <h1>같이 만날 날과 장소,<br>한 번에 정해요</h1>
      <p class="lead">가능한 날짜를 모으고, 모두에게 공평한 장소를 추천받아 투표로 정하세요.</p>
    </section>

    <section class="home-card">
      <div class="field">
        <label for="nameInput">이름</label>
        <input id="nameInput" type="text" maxlength="10" placeholder="모임에서 보여줄 이름" autocomplete="off">
      </div>

      <div class="field">
        <label for="codeInput">초대 코드</label>
        <div class="code-row">
          <input id="codeInput" type="text" maxlength="6" placeholder="6자리 코드" autocomplete="off">
          <button id="joinBtn" class="btn" type="button">참여하기</button>
        </div>
      </div>
      <p id="error" class="error" role="alert"></p>

      <div class="divider">또는</div>
      <button id="createBtn" class="btn btn-accent" type="button">새 방 만들기</button>
    </section>
  </main>

  <dialog id="createDialog">
  <h2>새 방 만들기</h2>

  <div class="field">
    <label for="roomNameInput">방 이름</label>
    <input
      id="roomNameInput"
      type="text"
      maxlength="30"
      placeholder="예: 11월 동아리 회식"
    >
    <div class="field total-field">
    <label for="totalInput">총 인원수</label>
    <input id="totalInput" type="number" min="1" step="1" value="2" inputmode="numeric">
    </div>
  </div>

  <p id="dialogError" class="error" role="alert"></p>

  <div class="dialog-actions">
    <button id="cancelBtn" class="btn btn-ghost" type="button">
      취소
    </button>
    <button id="confirmBtn" class="btn" type="button">
      방 만들기
    </button>
  </div>
</dialog>

  <script src="/js/common.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
