<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>약속 조율</title>
  <link rel="stylesheet" href="/css/common.css">
  <link rel="stylesheet" href="/css/room.css">
</head>
<body>
  <main class="home">
    <div class="home-name">
      <label for="nameInput">이름</label>
      <input id="nameInput" type="text" maxlength="10" placeholder="모임에서 보여줄 이름" autocomplete="off">
    </div>

    <section class="home-body">
      <h1>같이 만날 날과 장소,<br>한 번에 정해요</h1>
      <p class="lead">초대 코드가 있으면 입력하고, 없으면 새 방을 만드세요.</p>

      <div class="code-row">
        <input id="codeInput" type="text" maxlength="6" placeholder="초대 코드 6자리" autocomplete="off" aria-label="초대 코드">
        <button id="joinBtn" class="btn" type="button">참여하기</button>
      </div>
      <p id="error" class="error" role="alert"></p>

      <div class="divider">또는</div>
      <button id="createBtn" class="btn btn-accent" type="button">방 만들기</button>
    </section>
  </main>

  <dialog id="createDialog">
    <h2>새 방 만들기</h2>
    <div class="field">
      <label for="roomNameInput">방 이름</label>
      <input id="roomNameInput" type="text" maxlength="30" placeholder="예: 11월 동아리 회식">
    </div>
    <p id="dialogError" class="error" role="alert"></p>
    <div class="dialog-actions">
      <button id="cancelBtn" class="btn btn-ghost" type="button">취소</button>
      <button id="confirmBtn" class="btn" type="button">방 만들기</button>
    </div>
  </dialog>

  <script src="/js/common.js"></script>
  <script src="/js/index.js"></script>
</body>
</html>
