
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>날짜 조율 | 우리 언제 만나?</title>

  <!-- Team common design and Pretendard font -->
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/date.css">

  <!-- Date calendar script -->
  <script src="./js/date.js" defer></script>
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-inner">
      <span class="logo">우리 언제 만나?</span>

      <a
        id="back-link"
        class="back-link"
        href="./room.html"
      >
        방으로 돌아가기
      </a>
    </div>
  </header>

  <main class="container">

    <!-- Page introduction -->
    <section class="page-heading">
      <span class="eyebrow">DATE SCHEDULER</span>

      <h1>우리 언제 만날까?</h1>

      <p>만날 수 있는 날짜를 모두 선택해 주세요.</p>
    </section>

    <div class="content-layout">

      <!-- Calendar area -->
      <section class="calendar-card">

        <!-- Reset all selections -->
        <div class="calendar-toolbar">
          <button
            id="reset-button"
            class="reset-button"
            type="button"
          >
            ↺ 선택 초기화
          </button>
        </div>

        <!-- Month navigation -->
        <div class="calendar-header">
          <button
            id="prev-month"
            class="nav-button"
            type="button"
            aria-label="이전 달"
          >
            &#10094;
          </button>

          <h2 id="month-title"></h2>

          <button
            id="next-month"
            class="nav-button"
            type="button"
            aria-label="다음 달"
          >
            &#10095;
          </button>
        </div>

        <!-- Weekday labels -->
        <div class="weekdays">
          <span>일</span>
          <span>월</span>
          <span>화</span>
          <span>수</span>
          <span>목</span>
          <span>금</span>
          <span>토</span>
        </div>

        <!-- Calendar dates generated by JavaScript -->
        <div
          id="calendar-grid"
          class="calendar-grid"
        ></div>

        <!-- Calendar legend -->
        <div class="calendar-footer">

          <div class="legend-item">
            <span class="legend-my"></span>
            <span>내가 선택한 날짜</span>
          </div>

          <div class="legend-item">
            <span class="legend-popular"></span>
            <span>선택 인원수</span>
          </div>

          <div class="legend-item">
            <span class="legend-star">★</span>
            <span>최다 선택</span>
          </div>

          <button id="today-button" type="button">
            이번 달
          </button>
        </div>

        <!-- Voting information for a selected date -->
        <section
          id="vote-details"
          class="vote-details"
          aria-live="polite"
        >
          <p class="detail-hint">
            날짜를 클릭하면 참여 인원과 이름을 확인할 수 있습니다.
          </p>
        </section>

      </section>

      <!-- Selected date list -->
      <aside class="selection-card">

        <h2>선택한 날짜</h2>

        <p class="selection-description">
          날짜를 다시 누르거나 × 버튼을 누르면
          선택을 취소할 수 있습니다.
        </p>

        <p class="selection-count">
          총 <strong id="selected-count">0</strong>일 선택
        </p>

        <!-- Selected dates generated by JavaScript -->
        <ul
          id="selected-list"
          class="selected-list"
        ></ul>

        <!-- Save selections to the server -->
        <button
          id="save-button"
          class="save-button"
          type="button"
        >
          선택한 날짜 저장
        </button>

        <p
          id="save-status"
          class="save-status"
          role="status"
        ></p>

      </aside>

    </div>

    <!-- Information notice -->
    <p class="preview-notice">
      날짜 선택은 같은 방의 참여자들과 공유됩니다.
      변경한 날짜는 저장 버튼을 눌러야 최종 반영됩니다.
    </p>

  </main>
</body>
</html>
