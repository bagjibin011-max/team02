
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날짜 조율 | 약속 조율 플랫폼</title>
  <link rel="stylesheet" href="./css/date.css">
  <script src="./js/date.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <span class="logo">우리 언제 만나?</span>

      <a id="back-link" href="./room.html" class="back-link">
        방으로 돌아가기
      </a>
    </div>
  </header>

  <main class="container">
    <section class="page-heading">
      <span class="eyebrow">DATE SCHEDULER</span>
      <h1>우리 언제 만날까?</h1>
      <p>만날 수 있는 날짜를 모두 선택해 주세요.</p>
    </section>

    <div class="content-layout">

      <!-- Calendar area -->
      <section class="calendar-card">

        <div class="calendar-toolbar">
          <button
            id="reset-button"
            class="reset-button"
            type="button"
          >
            ↺ 선택 초기화
          </button>
        </div>

        <div class="calendar-header">
          <button
            id="prev-month"
            class="nav-button"
            type="button"
            aria-label="이전 달"
          >
            &#10094;
          </button>

          <h2 id="month-title"></h2>

          <button
            id="next-month"
            class="nav-button"
            type="button"
            aria-label="다음 달"
          >
            &#10095;
          </button>
        </div>

        <div class="weekdays">
          <span>일</span>
          <span>월</span>
          <span>화</span>
          <span>수</span>
          <span>목</span>
          <span>금</span>
          <span>토</span>
        </div>

        <div id="calendar-grid" class="calendar-grid"></div>

        <div class="calendar-footer">
          <div class="legend-item">
            <span class="legend-my"></span>
            <span>내가 선택한 날짜</span>
          </div>

          <div class="legend-item">
            <span class="legend-popular"></span>
            <span>많이 선택한 날짜</span>
          </div>

          <button id="today-button" type="button">
            이번 달
          </button>
        </div>

        <!-- Voting details appear here using JavaScript -->
        <div id="vote-details" class="vote-details">
          <p class="detail-hint">
            날짜를 클릭하면 참여 인원과 이름을 확인할 수 있습니다.
          </p>
        </div>
      </section>

      <!-- Selected dates area -->
      <aside class="selection-card">
        <h2>선택한 날짜</h2>

        <p class="selection-description">
          날짜를 다시 누르면 선택이 취소됩니다.
        </p>

        <p class="selection-count">
          총 <strong id="selected-count">0</strong>일 선택
        </p>

        <ul id="selected-list" class="selected-list"></ul>

        <button
          id="save-button"
          class="save-button"
          type="button"
        >
          선택한 날짜 저장
        </button>

        <p id="save-status" class="save-status" role="status"></p>
      </aside>
    </div>

    <p class="preview-notice">
      날짜 선택은 같은 방의 참여자들과 공유됩니다.
      다른 참여자의 변경 사항은 새로고침하면 확인할 수 있습니다.
    </p>
  </main>
</body>
</html>
