
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>날짜 조율 | 약속 조율 플랫폼</title>
  <link rel="stylesheet" href="./css/date.css">
  <script src="./js/date.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <span class="logo">우리 언제 만나?</span>
      <a id="back-link" href="./room.html" class="back-link">
        방으로 돌아가기
      </a>
    </div>
  </header>

  <main class="container">
    <section class="page-heading">
      <span class="eyebrow">DATE SCHEDULER</span>
      <h1>우리 언제 만날까?</h1>
      <p>만날 수 있는 날짜를 모두 선택해 주세요.</p>
      <div class="room-info">
        방 코드: <strong id="room-code"></strong>
      </div>
    </section>

    <div class="content-layout">
      <section class="calendar-card">

        <!-- Reset button above the calendar -->
        <div class="calendar-toolbar">
          <button id="reset-button" class="reset-button" type="button">
            ↺ 선택 초기화
          </button>
        </div>

        <!-- Calendar month navigation -->
        <div class="calendar-header">
          <button id="prev-month" class="nav-button"
                  type="button" aria-label="이전 달">
            &#10094;
          </button>

          <h2 id="month-title"></h2>

          <button id="next-month" class="nav-button"
                  type="button" aria-label="다음 달">
            &#10095;
          </button>
        </div>

        <!-- Weekday labels -->
        <div class="weekdays">
          <span>일</span>
          <span>월</span>
          <span>화</span>
          <span>수</span>
          <span>목</span>
          <span>금</span>
          <span>토</span>
        </div>

        <!-- Calendar dates are generated by JavaScript -->
        <div id="calendar-grid" class="calendar-grid"></div>

        <div class="calendar-footer">
          <span class="legend-dot"></span>
          <span>내가 선택한 날짜</span>

          <button id="today-button" type="button">
            이번 달
          </button>
        </div>
      </section>

      <!-- Selected date list -->
      <aside class="selection-card">
        <h2>선택한 날짜</h2>
        <p class="selection-description">
          날짜를 다시 누르면 선택이 취소됩니다.
        </p>

        <p class="selection-count">
          총 <strong id="selected-count">0</strong>일 선택
        </p>

        <ul id="selected-list" class="selected-list"></ul>

        <button id="save-button" class="save-button" type="button">
          선택한 날짜 저장
        </button>

        <p id="save-status" class="save-status" role="status"></p>
      </aside>
    </div>

    <p class="preview-notice">
      현재는 화면 개발 단계입니다.
      선택 결과는 이 브라우저에만 임시 저장되며,
      다른 참여자와 공유되지 않습니다.
    </p>
  </main>
</body>
</html>
